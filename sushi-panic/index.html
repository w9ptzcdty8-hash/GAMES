<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">

    <title>寿司パニック</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================
         プレイエリア（広告枠を除いた領域）
         .game-stage は resizeCanvas() によって
         縦長比率(480x854)を維持したまま中央にフィットする
    ========================================= -->
    <div id="play-area">
        <div id="game-stage">

            <!-- 初期化中（アセット生成中）のみ表示 -->
            <div id="loading">準備中...</div>

            <!-- ゲーム描画用Canvas（論理解像度 480x854）
                 タイトル・ポーズ・ゲームオーバー・作り方画面も
                 すべてこのCanvas内に描画される -->
            <canvas id="game-canvas"></canvas>

        </div>
        <!-- /#game-stage -->
    </div>
    <!-- /#play-area -->

    <!-- ========================================
         固定広告
    ========================================= -->
    <div class="ad-banner">
        <div style="max-width: 100%;">
            <!-- admax -->
            <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
            <!-- admax -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
