<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>FOUR COLORS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen">
            <div class="logo-container">
                <div class="logo-title">FOUR COLORS</div>
                <div class="logo-subtitle">DEADLINE PUZZLE</div>

                <div class="quote-container">
                    <div class="quote-text">"Four colours are necessary and sufficient."</div>
                    <div class="quote-author">— Francis Guthrie</div>
                </div>

                <div class="best-score-badge">
                    <div class="label">BEST SCORE</div>
                    <div id="title-best-score" class="val">0</div>
                </div>
            </div>

            <div class="difficulty-selector">
                <div class="diff-label">DIFFICULTY</div>
                <div class="diff-buttons">
                    <button class="btn diff-btn active" data-diff="EASY">EASY</button>
                    <button class="btn diff-btn" data-diff="NORMAL">NORMAL</button>
                    <button class="btn diff-btn" data-diff="HARD">HARD</button>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary" style="width: 100%; max-width: 300px;">GAME START</button>

            <a href="https://mrs-games.pages.dev/" class="mrs-games-link" target="_blank" rel="noopener">MRS GAMES</a>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div class="header-left">
                    <button id="pause-btn" class="btn pause-btn" aria-label="Pause">
                        <svg viewBox="0 0 24 24">
                            <rect x="6" y="4" width="4" height="16" rx="1.5" />
                            <rect x="14" y="4" width="4" height="16" rx="1.5" />
                        </svg>
                    </button>
                    <div class="score-box">
                        <div id="game-score" class="score-val">0</div>
                        <div class="score-sub-row">
                            <span id="game-diff-tag" class="diff-mode-tag">EASY</span>
                            <div id="game-best-score" class="best-val-mini">BEST: 0</div>
                        </div>
                    </div>
                </div>

                <div class="color-sequence-box">
                    <div class="color-slot">
                        <span class="slot-label">NOW</span>
                        <div id="color-now" class="color-circle now"></div>
                    </div>
                    <div class="color-slot">
                        <span class="slot-label">NEXT</span>
                        <div id="color-next" class="color-circle next"></div>
                    </div>
                    <div class="color-slot">
                        <span class="slot-label">AFTER</span>
                        <div id="color-after" class="color-circle after"></div>
                    </div>
                </div>
            </div>

            <div class="canvas-container" id="canvas-container">
                <canvas id="game-canvas"></canvas>
                <div class="deadline-bar"></div>
                <div class="deadline-label">DEADLINE</div>
            </div>
        </div>

        <!-- 中断（ポーズ）ダイアログ -->
        <div id="pause-overlay" class="overlay-modal hidden">
            <div class="modal-card">
                <div class="modal-title">PAUSE</div>
                <div class="modal-scores">
                    <div class="modal-score-row">
                        <span class="modal-score-label">SCORE</span>
                        <span id="pause-score" class="modal-score-val highlight">0</span>
                    </div>
                    <div class="modal-score-row">
                        <span class="modal-score-label">BEST SCORE</span>
                        <span id="pause-best" class="modal-score-val">0</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="resume-btn" class="btn btn-primary">RESUME</button>
                    <button id="pause-retry-btn" class="btn">RETRY</button>
                    <button id="pause-title-btn" class="btn">TITLE</button>
                </div>
            </div>
        </div>

        <!-- リザルトダイアログ -->
        <div id="result-overlay" class="overlay-modal hidden">
            <div class="modal-card">
                <div class="modal-title gameover">GAME OVER</div>
                <div class="modal-scores">
                    <div class="modal-score-row">
                        <span class="modal-score-label">SCORE</span>
                        <span id="result-score" class="modal-score-val highlight">0</span>
                    </div>
                    <div class="modal-score-row">
                        <span class="modal-score-label">BEST SCORE</span>
                        <span id="result-best" class="modal-score-val">0</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="check-board-btn" class="btn btn-check">CHECK BOARD</button>
                    <button id="retry-btn" class="btn btn-primary">RETRY</button>
                    <button id="result-title-btn" class="btn">TITLE</button>
                    <button id="dev-log-btn" class="btn btn-dev-log">LOG (DEV)</button>
                </div>
            </div>
        </div>

        <!-- 確認モード専用：フローティング復帰UI -->
        <div id="check-overlay-hud" class="hidden">
            <button id="return-result-btn" class="btn btn-primary" style="width: 100%;">RETURN TO RESULT</button>
        </div>

        <!-- 開発用ログ表示モーダル -->
        <div id="log-modal" class="hidden">
            <h3 style="margin-bottom: 10px; color: #f1c40f;">DEV DEBUG LOG</h3>
            <textarea id="log-text" readonly></textarea>
            <div style="display: flex; gap: 10px;">
                <button id="copy-log-btn" class="btn btn-primary" style="flex: 1;">COPY LOG</button>
                <button id="close-log-btn" class="btn" style="flex: 1;">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- ========================================
         固定広告
    ========================================= -->

    <div class="ad-banner">

        <div style="max-width: 100%;">

            <!-- admax -->
            <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
            <!-- admax -->

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
