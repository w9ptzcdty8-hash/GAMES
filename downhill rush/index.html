<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ski Downhill Rush</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        #main-wrapper {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #75c6f1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 0;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ad-container {
            width: 100%;
            margin-top: 15px;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- admax -->
    <div id="ad-container">
        <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
    </div>
    <!-- admax -->
</div>

<script>
// サウンドコントローラー (Web Audio API)
class SoundController {
    constructor() {
        this.ctx = null;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playBigJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    }

    playFlap() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
    }

    playLanding() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    playCrash() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    playNpcFall() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    playNewRecord() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
    }
}

const sounds = new SoundController();

// キャンバス初期化
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const BASE_WIDTH = 960;
const BASE_HEIGHT = 540;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

// 静的背景グラデーション
const skyGrad = ctx.createLinearGradient(0, 0, BASE_WIDTH, BASE_HEIGHT);
skyGrad.addColorStop(0, '#75c6f1');
skyGrad.addColorStop(0.6, '#bce3f7');
skyGrad.addColorStop(1, '#e8f5fb');

// 坂の基本角度
const SLOPE_ANGLE = 0.28;
const SLOPE_COS = Math.cos(SLOPE_ANGLE);
const SLOPE_SIN = Math.sin(SLOPE_ANGLE);

// ゲーム状態
const STATE = {
    TITLE: 'title',
    HIGHSCORE_MODAL: 'high_score_modal',
    PLAYING: 'playing',
    BIG_JUMPING: 'big_jumping',
    GAMEOVER: 'gameover'
};

let gameState = STATE.TITLE;

// ベース滑走スピード
const BASE_SPEED = 7.0;
let speed = BASE_SPEED;

let distance = 0;
let totalJumpDistance = 0;
let lastJumpDist = 0;
let jumpHistory = [];
let feedbackText = '';
let feedbackTimer = 0;
let isNewHighScore = false;

// プレイヤー
const PLAYER_X = 200;
const player = {
    slopeX: PLAYER_X,
    airOffset: 0,
    vAir: 0,
    gravity: 0.65,
    jumpPower: -11.0,
    isJumping: false,
    
    flapBoost: 0,
    tapCountInAir: 0,

    // 崖下落下アニメーション用
    isFallingInHole: false,
    fallX: PLAYER_X,
    fallY: 0
};

// ハイスコアメモリデータ
let highScoreData = {
    totalScore: 0,
    bestDistance: 0,
    bestJumpBonus: 0
};

function loadHighScore() {
    try {
        if (window.mySkiHighScore) {
            highScoreData = window.mySkiHighScore;
        }
    } catch(e) {}
}

function saveHighScore(total, dist, jump) {
    highScoreData = {
        totalScore: total,
        bestDistance: dist,
        bestJumpBonus: jump
    };
    try {
        window.mySkiHighScore = highScoreData;
    } catch(e) {}
}

loadHighScore();

// 斜面の基準位置
const SLOPE_ORIGIN_Y = 200;

function getSlopeY(x) {
    return SLOPE_ORIGIN_Y + x * Math.tan(SLOPE_ANGLE);
}

// ボタンUI領域
const buttons = {
    startBtn: { x: BASE_WIDTH / 2 - 160, y: 310, w: 320, h: 64 },
    highScoreBtn: { x: BASE_WIDTH / 2 - 160, y: 395, w: 320, h: 56 },
    closeModalBtn: { x: BASE_WIDTH / 2 - 110, y: 410, w: 220, h: 52 },
    restartBtn: { x: BASE_WIDTH / 2 - 160, y: 390, w: 320, h: 56 },
    titleBtn: { x: BASE_WIDTH / 2 - 160, y: 458, w: 320, h: 50 }
};

function isPointInRect(px, py, rect) {
    return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}

function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;

    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }

    const x = (clientX - rect.left) * (BASE_WIDTH / rect.width);
    const y = (clientY - rect.top) * (BASE_HEIGHT / rect.height);
    return { x, y };
}

// 雪しぶきパーティクル
let particles = [];

function createSnowSpray(x, y, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5 - speed * 0.3 * SLOPE_COS,
            vy: (Math.random() - 0.5) * 5 - speed * 0.3 * SLOPE_SIN,
            life: 1.0,
            size: Math.random() * 4 + 2
        });
    }
}

// 障害物配列とジャンプ台管理
let obstacles = [];
let spawnTimer = 0;
let nextRampDistance = 1000;

// タップ・入力処理
function handleInput(e) {
    if (e) e.preventDefault();
    sounds.init();

    const pt = getCanvasCoords(e);

    if (gameState === STATE.TITLE) {
        if (isPointInRect(pt.x, pt.y, buttons.startBtn)) {
            resetGame();
            gameState = STATE.PLAYING;
        } else if (isPointInRect(pt.x, pt.y, buttons.highScoreBtn)) {
            gameState = STATE.HIGHSCORE_MODAL;
        }
        return;
    }

    if (gameState === STATE.HIGHSCORE_MODAL) {
        if (isPointInRect(pt.x, pt.y, buttons.closeModalBtn)) {
            gameState = STATE.TITLE;
        }
        return;
    }

    if (gameState === STATE.GAMEOVER) {
        if (isPointInRect(pt.x, pt.y, buttons.restartBtn)) {
            resetGame();
            gameState = STATE.PLAYING;
        } else if (isPointInRect(pt.x, pt.y, buttons.titleBtn)) {
            gameState = STATE.TITLE;
        }
        return;
    }

    // 崖下に落下中の動作中はタップによるジャンプ不可
    if (player.isFallingInHole) return;

    if (gameState === STATE.PLAYING) {
        if (!player.isJumping) {
            player.vAir = player.jumpPower;
            player.isJumping = true;
            player.tapCountInAir = 0;
            sounds.playJump();
            createSnowSpray(player.slopeX, getSlopeY(player.slopeX), 12);
        } else {
            player.flapBoost += 0.9;
            player.tapCountInAir++;
            sounds.playFlap();
            createSnowSpray(player.slopeX - 5, getSlopeY(player.slopeX) - player.airOffset, 4);
        }
    } else if (gameState === STATE.BIG_JUMPING) {
        player.flapBoost += 1.2;
        player.tapCountInAir++;
        sounds.playFlap();
        createSnowSpray(player.slopeX - 5, getSlopeY(player.slopeX) - player.airOffset, 5);
    }
}

window.addEventListener('touchstart', handleInput, { passive: false });
window.addEventListener('mousedown', handleInput);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (gameState === STATE.TITLE) {
            resetGame();
            gameState = STATE.PLAYING;
        } else if (gameState === STATE.HIGHSCORE_MODAL) {
            gameState = STATE.TITLE;
        } else if (gameState === STATE.GAMEOVER) {
            resetGame();
            gameState = STATE.PLAYING;
        } else {
            handleInput(e);
        }
    }
});

function resetGame() {
    speed = BASE_SPEED;
    distance = 0;
    totalJumpDistance = 0;
    lastJumpDist = 0;
    jumpHistory = [];
    obstacles = [];
    particles = [];
    spawnTimer = 0;
    nextRampDistance = 1000;
    feedbackText = '';
    feedbackTimer = 0;
    isNewHighScore = false;
    player.slopeX = PLAYER_X;
    player.airOffset = 0;
    player.vAir = 0;
    player.isJumping = false;
    player.flapBoost = 0;
    player.tapCountInAir = 0;
    player.isFallingInHole = false;
    player.fallX = PLAYER_X;
    player.fallY = 0;
}

// 穴生成
function createHoleObstacle(spawnDist) {
    const holeWidth = 70 + Math.random() * 35;
    return { type: 'hole', dist: spawnDist, w: holeWidth };
}

// 障害物生成
function updateSpawns() {
    if (gameState === STATE.BIG_JUMPING || player.isFallingInHole) return;

    spawnTimer += speed;

    if (distance >= nextRampDistance) {
        const spawnDist = 1100;
        obstacles.push({ type: 'ramp', dist: spawnDist, w: 100, h: 45, triggered: false });
        nextRampDistance += 1000;
        spawnTimer = -200;
        return;
    }

    const currentDist = distance;
    if (Math.abs(currentDist - (nextRampDistance - 1000)) < 15 || Math.abs(currentDist - nextRampDistance) < 15) {
        return;
    }

    const minSpawnInterval = 420;
    const randomExtraInterval = 180;

    if (spawnTimer > minSpawnInterval + Math.random() * randomExtraInterval) {
        spawnTimer = 0;
        const spawnDist = 1100;

        if (distance < 500) {
            obstacles.push({ type: 'snowman', dist: spawnDist, w: 38, h: 48 });
        } 
        else if (distance < 1000) {
            if (Math.random() < 0.5) {
                obstacles.push({ type: 'snowman', dist: spawnDist, w: 38, h: 48 });
            } else {
                obstacles.push(createHoleObstacle(spawnDist));
            }
        } 
        else if (distance < 2000) {
            const rand = Math.random();
            if (rand < 0.35) {
                const snowCount = distance > 1200 && Math.random() < 0.4 ? (Math.random() < 0.5 ? 2 : 3) : 1;
                for (let k = 0; k < snowCount; k++) {
                    obstacles.push({ type: 'snowman', dist: spawnDist + (k * 45), w: 38, h: 48 });
                }
            } else if (rand < 0.70) {
                obstacles.push(createHoleObstacle(spawnDist));
            } else {
                obstacles.push({ type: 'tree', dist: spawnDist, w: 48, h: 75, isTall: false });
            }
        }
        else if (distance < 3000) {
            const rand = Math.random();
            if (rand < 0.25) {
                const snowCount = Math.random() < 0.5 ? (Math.random() < 0.5 ? 2 : 3) : 1;
                for (let k = 0; k < snowCount; k++) {
                    obstacles.push({ type: 'snowman', dist: spawnDist + (k * 45), w: 38, h: 48 });
                }
            } else if (rand < 0.50) {
                obstacles.push(createHoleObstacle(spawnDist));
            } else if (rand < 0.75) {
                obstacles.push({ type: 'tree', dist: spawnDist, w: 48, h: 75, isTall: false });
            } else {
                obstacles.push({ type: 'skier', dist: spawnDist, w: 40, h: 58, relSpeed: 2.0, falling: false, fallY: 0 });
            }
        }
        else {
            const rand = Math.random();
            if (rand < 0.20) {
                const snowCount = Math.random() < 0.5 ? (Math.random() < 0.5 ? 2 : 3) : 1;
                for (let k = 0; k < snowCount; k++) {
                    obstacles.push({ type: 'snowman', dist: spawnDist + (k * 45), w: 38, h: 48 });
                }
            } else if (rand < 0.40) {
                obstacles.push(createHoleObstacle(spawnDist));
            } else if (rand < 0.60) {
                obstacles.push({ type: 'tree', dist: spawnDist, w: 48, h: 75, isTall: false });
            } else if (rand < 0.80) {
                obstacles.push({ type: 'skier', dist: spawnDist, w: 40, h: 58, relSpeed: 2.0, falling: false, fallY: 0 });
            } else {
                obstacles.push({ type: 'tree', dist: spawnDist, w: 58, h: 110, isTall: true });
            }
        }
    }
}

// 大ジャンプ開始
function triggerBigJump(rampObs) {
    if (rampObs.triggered) return;
    rampObs.triggered = true;

    gameState = STATE.BIG_JUMPING;
    player.vAir = -15;
    player.airOffset = 10;
    player.flapBoost = 0;
    player.tapCountInAir = 0;
    lastJumpDist = 0;

    sounds.playBigJump();
}

// 更新処理
function update() {
    if (gameState === STATE.TITLE || gameState === STATE.HIGHSCORE_MODAL) {
        distance += 0.5;
        if (Math.random() < 0.2) {
            createSnowSpray(PLAYER_X - 10, getSlopeY(PLAYER_X), 1);
        }
        updateParticles();
        return;
    }

    if (gameState === STATE.PLAYING || gameState === STATE.BIG_JUMPING) {
        distance += speed * 0.12;

        updateSpawns();

        const holes = obstacles.filter(o => o.type === 'hole');

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            
            if (obs.type === 'skier') {
                if (!obs.falling) {
                    obs.dist -= (speed - obs.relSpeed);

                    for (let h of holes) {
                        const holeLeft = h.dist - h.w / 2;
                        const holeRight = h.dist + h.w / 2;
                        if (obs.dist >= holeLeft && obs.dist <= holeRight) {
                            obs.falling = true;
                            sounds.playNpcFall();
                            break;
                        }
                    }
                } else {
                    obs.fallY += 10;
                    obs.dist -= speed * 0.5;
                }
            } else {
                obs.dist -= speed;
            }

            const ox = obs.dist;
            const px = player.slopeX;

            // 穴への落下判定（落下開始のトリガー）
            if (!player.isFallingInHole && obs.type === 'hole') {
                const holeLeft = ox - obs.w * 0.35;
                const holeRight = ox + obs.w * 0.35;

                if (px >= holeLeft && px <= holeRight && player.airOffset <= 5) {
                    player.isFallingInHole = true;
                    player.fallX = px;
                    player.fallY = 0;
                    sounds.playNpcFall();
                }
            } else if (!player.isFallingInHole && obs.type === 'ramp') {
                const rampStart = ox - obs.w / 2;
                const rampTip = ox + obs.w / 2;

                if (px >= rampStart && px <= rampTip) {
                    if (player.airOffset < 30 && !obs.triggered) {
                        triggerBigJump(obs);
                    }
                }
            } else if (!player.isFallingInHole && obs.type === 'skier') {
                if (!obs.falling && Math.abs(ox - px) < 28) {
                    if (player.airOffset < obs.h * 0.7) {
                        gameOver();
                    }
                }
            } else if (!player.isFallingInHole && Math.abs(ox - px) < 28) {
                if (player.airOffset < obs.h * 0.72) {
                    gameOver();
                }
            }

            if (obs.dist < -200 || (obs.falling && obs.fallY > BASE_HEIGHT)) {
                obstacles.splice(i, 1);
            }
        }
    }

    // 崖下落下アニメーション処理（背景のスクロールは継続したまま穴と一緒に落ちていく）
    if (player.isFallingInHole) {
        player.fallY += 11; // 下方向へ落下
        player.fallX -= speed * 0.4; // 穴と一緒に左方向へスクロール流れ

        const currentDisplayY = getSlopeY(player.fallX) + player.fallY;

        // ★ 画面底を完全に越えてフレーム外に消えて初めてゲームオーバー画面へ移行！
        if (currentDisplayY > BASE_HEIGHT + 80) {
            gameOver();
            return;
        }
    }

    // 通常ジャンプ物理
    if (gameState === STATE.PLAYING && !player.isFallingInHole) {
        if (player.isJumping) {
            if (player.flapBoost > 0) {
                player.vAir -= player.flapBoost;
                player.flapBoost = 0;
            }

            player.vAir += player.gravity * 0.65;
            player.airOffset -= player.vAir;

            if (player.airOffset <= 0) {
                createSnowSpray(player.slopeX, getSlopeY(player.slopeX), 15);
                sounds.playLanding();
                player.airOffset = 0;
                player.vAir = 0;
                player.isJumping = false;
                player.flapBoost = 0;
            }
        } else {
            if (Math.random() < 0.4) {
                createSnowSpray(player.slopeX - 10, getSlopeY(player.slopeX), 2);
            }
        }

    } else if (gameState === STATE.BIG_JUMPING && !player.isFallingInHole) {
        // 大ジャンプ物理
        if (player.flapBoost > 0) {
            player.vAir -= player.flapBoost;
            player.flapBoost = 0;
        }

        player.vAir += player.gravity * 0.35;
        player.airOffset -= player.vAir;

        if (player.airOffset > 320) {
            player.airOffset = 320;
            if (player.vAir < 0) player.vAir = 0;
        }

        lastJumpDist += Math.floor(speed * 0.6);

        if (player.airOffset <= 0) {
            player.airOffset = 0;
            player.vAir = 0;
            gameState = STATE.PLAYING;

            createSnowSpray(player.slopeX, getSlopeY(player.slopeX), 30);
            sounds.playLanding();

            jumpHistory.push(lastJumpDist);
            totalJumpDistance += lastJumpDist;

            feedbackText = `JUMP #${jumpHistory.length}: +${lastJumpDist}m!`;
            feedbackTimer = 60;
        }
    }

    if (feedbackTimer > 0) feedbackTimer--;

    updateParticles();
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function gameOver() {
    sounds.playCrash();
    createSnowSpray(player.slopeX, getSlopeY(player.slopeX), 40);
    player.isFallingInHole = false; // 落下フラグのリセット
    gameState = STATE.GAMEOVER;

    const currentTotalScore = Math.floor(distance) + totalJumpDistance;
    if (currentTotalScore > highScoreData.totalScore) {
        isNewHighScore = true;
        saveHighScore(currentTotalScore, Math.floor(distance), totalJumpDistance);
        sounds.playNewRecord();
    }
}

// 描画メイン関数
function render() {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 山並み
    ctx.fillStyle = '#a9d2e9';
    ctx.beginPath();
    ctx.moveTo(0, 180);
    ctx.lineTo(200, 80);
    ctx.lineTo(450, 220);
    ctx.lineTo(700, 90);
    ctx.lineTo(960, 240);
    ctx.lineTo(960, BASE_HEIGHT);
    ctx.lineTo(0, BASE_HEIGHT);
    ctx.fill();

    const sortedObs = [...obstacles].sort((a, b) => a.dist - b.dist);

    // 1. ジャンプ台の縦線を斜面の後ろに隠す
    sortedObs.forEach(obs => {
        if (obs.type === 'ramp') {
            const rStart = obs.dist - obs.w / 2;
            ctx.strokeStyle = '#2b384a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(rStart, getSlopeY(rStart));
            ctx.lineTo(rStart, BASE_HEIGHT + 100);
            ctx.stroke();
        }
    });

    // 2. 斜面ブロック描画
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#2b384a';
    ctx.lineWidth = 2;

    let currentX = -100;

    sortedObs.forEach(obs => {
        if (obs.type === 'hole') {
            const hLeft = obs.dist - obs.w / 2;
            const hRight = obs.dist + obs.w / 2;

            if (hLeft > currentX) {
                drawSlopeBlock(currentX, hLeft);
            }
            currentX = Math.max(currentX, hRight);

        } else if (obs.type === 'ramp') {
            const rStart = obs.dist - obs.w / 2;
            const rEnd = obs.dist + obs.w / 2;

            if (rStart > currentX) {
                drawSlopeBlock(currentX, rStart);
            }
            drawRampBlock(rStart, rEnd, obs.h);
            currentX = Math.max(currentX, rEnd);
        }
    });

    if (currentX < BASE_WIDTH + 100) {
        drawSlopeBlock(currentX, BASE_WIDTH + 100);
    }

    function drawSlopeBlock(x1, x2) {
        const y1 = getSlopeY(x1);
        const y2 = getSlopeY(x2);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x2, BASE_HEIGHT + 100);
        ctx.lineTo(x1, BASE_HEIGHT + 100);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1, BASE_HEIGHT + 100);
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2, BASE_HEIGHT + 100);
        ctx.stroke();

        ctx.fillStyle = 'rgba(150, 180, 200, 0.15)';
        ctx.fillRect(x1, y1 + 5, 4, BASE_HEIGHT);
        ctx.fillRect(x2 - 4, y2 + 5, 4, BASE_HEIGHT);
        ctx.fillStyle = '#ffffff';
    }

    function drawRampBlock(x1, x2, height) {
        const y1 = getSlopeY(x1);
        const y2 = getSlopeY(x2);

        ctx.beginPath();
        ctx.moveTo(x1, y1);

        const cp1x = x1 + (x2 - x1) * 0.5;
        const cp1y = y1 + (y2 - y1) * 0.5;
        const cp2x = x1 + (x2 - x1) * 0.8;
        const cp2y = y2 - height * 0.2;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2 - height);
        ctx.lineTo(x2, BASE_HEIGHT + 100);
        ctx.lineTo(x1, BASE_HEIGHT + 100);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2 - height);
        ctx.lineTo(x2, BASE_HEIGHT + 100);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
    }

    // スピードライン
    if (gameState === STATE.PLAYING || gameState === STATE.BIG_JUMPING) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            let lx = (Date.now() * (speed * 0.2) + i * 180) % (BASE_WIDTH + 200) - 100;
            let ly = getSlopeY(lx) - Math.random() * 200;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx - 30 * SLOPE_COS, ly - 30 * SLOPE_SIN);
            ctx.stroke();
        }
    }

    // 木・雪だるま・スキー客
    obstacles.forEach(obs => {
        if (obs.type === 'hole' || obs.type === 'ramp') return;

        const ox = obs.dist;
        const oy = getSlopeY(ox) + (obs.falling ? obs.fallY : 0);

        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(SLOPE_ANGLE + (obs.falling ? 0.4 : 0));

        if (obs.type === 'tree') {
            const trunkW = obs.isTall ? 10 : 8;
            const trunkH = obs.isTall ? 18 : 14;
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(-trunkW / 2, -trunkH, trunkW, trunkH);
            ctx.fillStyle = obs.isTall ? '#1b5e20' : '#2e7d32';
            ctx.beginPath();
            ctx.moveTo(-obs.w / 2, -trunkH);
            ctx.lineTo(0, -obs.h);
            ctx.lineTo(obs.w / 2, -trunkH);
            ctx.fill();
        } else if (obs.type === 'snowman') {
            ctx.fillStyle = '#e0f7fa';
            ctx.beginPath();
            ctx.arc(0, -14, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -34, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff6d00';
            ctx.fillRect(2, -36, 8, 3);
            ctx.fillStyle = '#263238';
            ctx.fillRect(-8, -44, 16, 3);
            ctx.fillRect(-5, -52, 10, 8);
        } else if (obs.type === 'skier') {
            ctx.fillStyle = '#ffb300';
            ctx.fillRect(-10, -40, 20, 26);
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.arc(0, -45, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#d32f2f';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-20, -2);
            ctx.lineTo(25, -2);
            ctx.stroke();

            if (obs.falling) {
                ctx.fillStyle = '#ff1744';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('AAAAH!', -24, -58);
            }
        }

        ctx.restore();
    });

    // 雪しぶき
    particles.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // プレイヤー描画（崖下に落ちていくアニメーション対応）
    const px = player.isFallingInHole ? player.fallX : player.slopeX;
    const py = player.isFallingInHole ? (getSlopeY(player.fallX) + player.fallY) : (getSlopeY(px) - player.airOffset);

    ctx.save();
    ctx.translate(px, py);
    const leanAngle = SLOPE_ANGLE + (player.isFallingInHole ? 0.4 : (player.airOffset > 0 ? -0.15 : 0.15));
    ctx.rotate(leanAngle);

    if (player.airOffset > 0 && !player.isFallingInHole) {
        ctx.save();
        ctx.translate(0, player.airOffset);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // スキー板
    ctx.strokeStyle = '#0288d1';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-20, -2);
    ctx.lineTo(25, -2);
    ctx.stroke();

    // ウェア
    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(-8, -30, 16, 22);

    // ヘルメット
    ctx.fillStyle = '#1565c0';
    ctx.beginPath();
    ctx.arc(4, -33, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(6, -35, 5, 4);

    // ストック
    ctx.strokeStyle = '#78909c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -20);
    ctx.lineTo(-18, -2);
    ctx.stroke();

    ctx.restore();

    // プレイ中/大ジャンプ中のHUD表示
    if (gameState === STATE.PLAYING || gameState === STATE.BIG_JUMPING) {
        if (gameState === STATE.BIG_JUMPING) {
            ctx.fillStyle = '#ff6d00';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('TAP TAP TO FLOAT! 🪂', px, py - 55);

            ctx.fillStyle = '#00e676';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`Air Bonus: +${lastJumpDist}m`, px, py - 30);
        }

        const uiRightX = BASE_WIDTH - 25;
        ctx.textAlign = 'right';

        ctx.fillStyle = '#0d47a1';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`Distance: ${Math.floor(distance)}m`, uiRightX, 38);
        ctx.fillText(`Jump Bonus: ${totalJumpDistance + (gameState === STATE.BIG_JUMPING ? lastJumpDist : 0)}m`, uiRightX, 68);

        ctx.fillStyle = '#1565c0';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`STAGE: ${getStageName(distance)}`, uiRightX, 98);

        if (feedbackTimer > 0) {
            ctx.fillStyle = '#ff6f00';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, BASE_WIDTH / 2, 110);
        }
    }

    // --- タイトル画面 ---
    if (gameState === STATE.TITLE) {
        ctx.fillStyle = 'rgba(10, 20, 30, 0.65)';
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 52px sans-serif';
        ctx.fillText('SKI DOWNHILL RUSH', BASE_WIDTH / 2, 140);

        ctx.fillStyle = '#81d4fa';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('HIGH-SPEED MOUNTAIN ACTION', BASE_WIDTH / 2, 185);

        if (highScoreData.totalScore > 0) {
            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`BEST SCORE: ${highScoreData.totalScore} pts`, BASE_WIDTH / 2, 235);
        }

        drawButton(buttons.startBtn, '#ff9800', '#f57c00', 'START GAME ⛷️');
        drawButton(buttons.highScoreBtn, '#0288d1', '#01579b', 'HIGH SCORES 🏆');
    }

    // --- ハイスコア画面ダイアログ ---
    if (gameState === STATE.HIGHSCORE_MODAL) {
        ctx.fillStyle = 'rgba(10, 20, 30, 0.75)';
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

        const modalX = BASE_WIDTH / 2 - 240;
        const modalY = 80;
        const modalW = 480;
        const modalH = 380;

        ctx.fillStyle = '#142232';
        ctx.strokeStyle = '#0288d1';
        ctx.lineWidth = 4;
        ctx.fillRect(modalX, modalY, modalW, modalH);
        ctx.strokeRect(modalX, modalY, modalW, modalH);

        ctx.fillStyle = '#ffd54f';
        ctx.textAlign = 'center';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('RECORD BOARD 🏆', BASE_WIDTH / 2, modalY + 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`TOP SCORE: ${highScoreData.totalScore} pts`, BASE_WIDTH / 2, modalY + 140);

        ctx.font = '18px sans-serif';
        ctx.fillStyle = '#b0bec5';
        ctx.fillText(`Best Downhill Run: ${highScoreData.bestDistance}m`, BASE_WIDTH / 2, modalY + 200);
        ctx.fillText(`Best Airtime Bonus: +${highScoreData.bestJumpBonus}m`, BASE_WIDTH / 2, 240);

        drawButton(buttons.closeModalBtn, '#ef5350', '#c62828', 'CLOSE');
    }

    // --- ゲームオーバー画面 ---
    if (gameState === STATE.GAMEOVER) {
        ctx.fillStyle = 'rgba(10, 20, 30, 0.85)';
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

        const totalScore = Math.floor(distance) + totalJumpDistance;

        ctx.fillStyle = '#ff1744';
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText('CRASHED!', BASE_WIDTH / 2, 100);

        if (isNewHighScore) {
            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('🎉 NEW HIGH SCORE! 🎉', BASE_WIDTH / 2, 138);
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Downhill Run: ${Math.floor(distance)}m`, BASE_WIDTH / 2, 175);

        // 回数別ジャンプ獲得内訳
        if (jumpHistory.length > 0) {
            ctx.fillStyle = '#81d4fa';
            ctx.font = 'bold 16px sans-serif';
            let jumpBreakdownStr = jumpHistory.map((d, idx) => `Jump #${idx + 1}: +${d}m`).join('  |  ');
            if (jumpBreakdownStr.length > 65) {
                jumpBreakdownStr = jumpBreakdownStr.substring(0, 62) + '...';
            }
            ctx.fillText(jumpBreakdownStr, BASE_WIDTH / 2, 205);
        }

        ctx.fillStyle = '#00e676';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(`Total Airtime Bonus: +${totalJumpDistance}m`, BASE_WIDTH / 2, 238);

        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(`TOTAL SCORE: ${totalScore}`, BASE_WIDTH / 2, 290);

        drawButton(buttons.restartBtn, '#ff9800', '#f57c00', 'PLAY AGAIN 🔄');
        drawButton(buttons.titleBtn, '#607d8b', '#37474f', 'TITLE MENU 🏠');
    }
}

// 汎用描画ボタンヘルパー
function drawButton(btn, c1, c2, text) {
    const grad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(btn.x, btn.y, btn.w, btn.h, btn.h / 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 21px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, btn.x + btn.w / 2, btn.y + btn.h / 2);
    ctx.restore();
}

function getStageName(dist) {
    if (dist < 500) return 'Snowman Zone';
    if (dist < 1000) return 'Cliff Abyss Zone';
    if (dist < 2000) return 'Pine Tree Zone';
    if (dist < 3000) return 'Crowded Slope Zone';
    return 'Giant Forest Zone';
}

// ループ開始
function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>
