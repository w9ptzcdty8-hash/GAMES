<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Color Sense</title>
<style>
  /* ============================================================
     STYLE
     ============================================================ */
  :root{
    --bg: #07070c;
    --panel: #101018;
    --panel-border: #23232f;
    --text: #eef0f5;
    --text-dim: #8b8ba0;
    --r: #ff1236;
    --g: #14ff5c;
    --b: #1560ff;
    --y: #fff21a;
    --c: #12f0ff;
    --m: #ff12e0;
    --w: #ffffff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; touch-action:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- top bar ---- */
  #topbar{
    width:100%; max-width:520px;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; gap:10px;
  }
  #topbar .stat{ font-size:13px; color:var(--text-dim); letter-spacing:.05em; }
  #topbar .stat b{ display:block; font-size:20px; color:var(--text); font-weight:700; }
  #topbar .btns{ display:flex; gap:8px; }
  .iconbtn{
    width:38px; height:38px; border-radius:10px;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .iconbtn:active{ transform:scale(.92); }

  /* ---- board area ---- */
  #boardWrap{
    position:relative; flex:1; width:100%;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  #boardInner{ position:relative; display:flex; gap:10px; align-items:flex-start; }
  canvas#board{
    display:block; background:linear-gradient(180deg,#0c0c14,#08080e);
    border:1px solid var(--panel-border); border-radius:10px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 20px 60px -20px rgba(0,0,0,.8);
  }
  #nextWrap{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding-top:4px;
  }
  #nextLabel{ font-size:11px; color:var(--text-dim); letter-spacing:.1em; }
  #next2Label{ font-size:9px; color:var(--text-dim); letter-spacing:.1em; opacity:.7; }
  .miniVenn{ width:64px; margin-top:8px; }
  .miniVenn svg{ width:100%; height:auto; display:block; border-radius:8px; }
  canvas#next{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
  }
  canvas#next2{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    opacity:.6; transform:scale(.8);
  }

  /* ---- touch controls ---- */
  #controls{
    width:100%; max-width:520px; display:flex; align-items:center; justify-content:center;
    gap:14px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .ctlbtn{
    width:56px; height:56px; border-radius:16px;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text); font-size:22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ctlbtn:active{ transform:scale(.9); background:#181822; }
  #rotateBtn{
    width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #2a2a3a, var(--panel));
  }

  /* ---- overlays ---- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    background:rgba(4,4,8,.86); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:14px;
  }
  .hidden{ display:none !important; }

  .title{
    font-size:42px; font-weight:800; letter-spacing:.06em; margin:0;
    color:var(--w);
    text-shadow:
      -2px 0 0 var(--r),
       2px 0 0 var(--b),
       0 2px 0 var(--g);
    animation:titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{ text-shadow:-2px 0 0 var(--r), 2px 0 0 var(--b), 0 2px 0 var(--g); }
    50%{ text-shadow:-4px 0 0 var(--r), 4px 0 0 var(--b), 0 3px 0 var(--g); }
  }
  .subtitle{ color:var(--text-dim); font-size:14px; letter-spacing:.08em; margin-top:-8px; }

  .diffContainer{ display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; max-width:280px; }
  .diffRow{ display:flex; gap:8px; justify-content:center; width:100%; }
  .diffbtn{
    flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--panel-border);
    background:var(--panel); color:var(--text); font-size:13px; font-weight:600; cursor:pointer;
  }
  .diffbtn.active{ box-shadow:0 0 0 1px currentColor inset; }
  .diffbtn[data-diff="PRACTICE"]{ border-color:#9a9ab0; color:#c7c7d8; flex:none; width:100%; }
  .diffbtn[data-diff="EASY"]{ border-color:var(--g); color:var(--g); }
  .diffbtn[data-diff="NORMAL"]{ border-color:var(--b); color:var(--b); }
  .diffbtn[data-diff="HARD"]{ border-color:var(--r); color:var(--r); }
  @keyframes diffFlash{
    0%,100%{ background:var(--panel); box-shadow:0 0 0 1px currentColor inset; }
    50%{ background:currentColor; box-shadow:0 0 0 1px currentColor inset, 0 0 18px 2px currentColor; }
  }
  .diffbtn.selecting{ animation:diffFlash .16s ease-in-out 3; pointer-events:none; }

  .primarybtn{
    padding:14px 40px; border-radius:12px; border:none;
    background:linear-gradient(90deg,var(--r),var(--g),var(--b));
    color:#08080c; font-size:16px; font-weight:800; letter-spacing:.05em; cursor:pointer;
  }
  .primarybtn:active{ transform:scale(.96); }
  .ghostbtn{
    padding:10px 24px; border-radius:10px; border:1px solid var(--panel-border);
    background:transparent; color:var(--text); font-size:14px; cursor:pointer;
  }
  .ghostbtn:active{ transform:scale(.96); }

  .bestScoresBtn{
    width:100%; padding:11px 0; border-radius:10px; border:1px solid var(--y);
    background:rgba(255, 242, 26, 0.08); color:var(--y); font-size:14px; font-weight:700;
    cursor:pointer; letter-spacing:.05em; margin-top:2px;
  }
  .bestScoresBtn:active{ transform:scale(.96); background:rgba(255, 242, 26, 0.16); }

  /* Best Scores Modal List */
  .scoreTabRow{ display:flex; gap:6px; width:100%; max-width:320px; justify-content:center; }
  .tabbtn{
    flex:1; padding:6px 0; border-radius:8px; border:1px solid var(--panel-border);
    background:var(--panel); color:var(--text-dim); font-size:11px; font-weight:700; cursor:pointer;
  }
  .tabbtn.active{ border-color:var(--y); color:var(--y); background:#181824; }

  .scoreList{
    width:100%; max-width:320px; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; gap:8px;
    min-height:180px; justify-content:center;
  }
  .scoreRow{ display:flex; align-items:center; justify-space-between; font-size:13px; }
  .scoreRank{ font-weight:800; width:28px; color:var(--text-dim); text-align:left; }
  .scoreRank.rank1{ color:var(--y); font-size:15px; }
  .scoreRank.rank2{ color:#e0e0e0; }
  .scoreRank.rank3{ color:#cd7f32; }
  .scoreVal{ font-weight:800; color:var(--text); font-size:16px; flex:1; text-align:left; }
  .scoreChain{ color:var(--c); font-size:12px; font-weight:600; text-align:right; }
  .emptyScores{ color:var(--text-dim); font-size:13px; font-style:italic; }

  .bignum{ font-size:38px; font-weight:800; }
  .newBestTag{ color:var(--y); font-size:13px; font-weight:800; letter-spacing:.1em; margin-bottom:-10px; }
  .dim{ color:var(--text-dim); font-size:13px; }

  .vennWrap{ width:150px; }
  .vennWrap svg{ width:100%; height:auto; display:block; }
  .vennCaption{ font-size:11px; color:var(--text-dim); letter-spacing:.04em; line-height:1.5; margin-top:4px; }

  #riseMeterWrap{
    width:100%; max-width:520px; padding:0 14px 6px;
    display:flex; align-items:center; gap:8px;
  }
  #riseMeterLabel{ font-size:10px; color:var(--text-dim); white-space:nowrap; letter-spacing:.04em; }
  #riseMeterTrack{
    flex:1; height:7px; border-radius:4px; overflow:hidden;
    background:linear-gradient(90deg, var(--g), var(--y), var(--r));
    border:1px solid var(--panel-border);
  }
  #riseMeterMask{
    height:100%; width:100%; background:var(--panel);
    margin-left:auto;
  }
</style>
</head>
<body>
<div id="app">

      <div class="vennWrap">
        <svg viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">

          <circle cx="100" cy="62" r="55" fill="#ff1236" style="mix-blend-mode:screen"/>

          <circle cx="128" cy="122" r="55" fill="#1560ff" style="mix-blend-mode:screen"/>
          <g font-family="-apple-system,sans-serif" font-weight="700" text-anchor="middle">
            <text x="100" y="42" font-size="14" fill="#111">R</text>
            <text x="48" y="138" font-size="14" fill="#111">G</text>
            <text x="152" y="138" font-size="14" fill="#111">B</text>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const COLS = 8;
const ROWS = 16;
const COLORS = ["R","G","B"];
const COLOR_HEX = {
  R: getVar("--r"), G: getVar("--g"), B: getVar("--b"),
  Y: getVar("--y"), C: getVar("--c"), M: getVar("--m"),
  W: getVar("--w")
};
function getVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// R+G=Y, G+B=C, B+R=M
const MIX_SECONDARY = {
  "R,G":"Y", "G,R":"Y",
  "G,B":"C", "B,G":"C",
  "B,R":"M", "R,B":"M"
};

// Complementary pairs
const TRIGGER_PAIRS = {
  "Y": "B",
  "C": "R",
  "M": "G"
};

const DROP_INTERVAL_MS = 750;
const SOFT_DROP_MS = 60;

// Animation timings
const CLEAR_ANIM_MS = 600;
const MIX_ANIM_MS = 450;
const POST_CLEAR_WAIT_MS = 250;

const MODE_CONFIG = {
  PRACTICE: { initialRows: 0, riseInterval: 0 },
  EASY:     { initialRows: 3, riseInterval: 60000 },
  NORMAL:   { initialRows: 4, riseInterval: 40000 },
  HARD:     { initialRows: 6, riseInterval: 30000 }
};
let selectedMode = "EASY";
let viewScoreTab = "EASY";
let riseInterval = 0;
let riseTimer = 0;
let riseAnimStart = -99999;
const RISE_ANIM_MS = 700;

// High Scores Memory (Top 5 per mode: [{ score, maxChain }, ...])
const highScores = {
  PRACTICE: [],
  EASY: [],
  NORMAL: [],
  HARD: []
};

// Chain & Phase Control
let gameState = "SPAWN";
let resolveSubState = "CHECK";
let resolveWaitTimer = 0;

let chainCount = 0;
let maxChainInGame = 0;
let chainTextAnim = null;
let recentlyMovedCells = [];

/* ============================================================
   AUDIO
   ============================================================ */
const Audio_ = (function(){
  let ctx = null;
  let muted = false;
  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, gain){
    if(muted) return;
    try{
      const c = ensureCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      g.gain.value = gain != null ? gain : 0.08;
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(g); g.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + dur);
    }catch(e){}
  }
  return {
    move(){ tone(220, .04, "square", .03); },
    rotate(){ tone(340, .05, "square", .04); },
    merge(){ tone(520, .15, "triangle", .07); },
    clear(chain){ tone(440 + chain * 120, .35, "sine", .12); },
    drop(){ tone(150, .06, "sine", .05); },
    gameOver(){ tone(120, .5, "sawtooth", .08); },
    toggleMute(){ muted = !muted; return muted; },
    isMuted(){ return muted; }
  };
})();

/* ============================================================
   GAME STATE
   ============================================================ */
let grid;
let piece;
let nextColors;
let nextNextColors;
let score = 0;
let dropTimer = 0;
let lastTime = 0;
let softDropping = false;
let running = false;
let paused = false;
let gameOver = false;
let cellSize = 28;
let mixAnimations = [];
let clearAnimations = [];
let slideAnimations = [];
let frameNow = 0;

/* ============================================================
   DOM
   ============================================================ */
const boardCanvas = document.getElementById("board");
const boardCtx = boardCanvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");
const next2Canvas = document.getElementById("next2");
const next2Ctx = next2Canvas.getContext("2d");
const scoreVal = document.getElementById("scoreVal");
const gameOverBestVal = document.getElementById("gameOverBestVal");
const maxChainVal = document.getElementById("maxChainVal");
const newBestTag = document.getElementById("newBestTag");
const riseMeterWrap = document.getElementById("riseMeterWrap");
const riseMeterMask = document.getElementById("riseMeterMask");
const titleScreen = document.getElementById("titleScreen");
const pauseScreen = document.getElementById("pauseScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const bestScoresScreen = document.getElementById("bestScoresScreen");
const scoreListContainer = document.getElementById("scoreListContainer");
const finalScoreEl = document.getElementById("finalScore");
const soundBtn = document.getElementById("soundBtn");
const pauseBtn = document.getElementById("pauseBtn");

/* ============================================================
   INIT / RESET
   ============================================================ */
function newGrid(initialRows){
  const g = [];
  for(let r=0;r<ROWS;r++){
    g.push(r >= ROWS - initialRows ? randomRow() : new Array(COLS).fill(null));
  }
  return g;
}
function randColor(){ return COLORS[(Math.random()*COLORS.length)|0]; }
function randomRow(){
  const row = [];
  for(let c=0;c<COLS;c++) row.push(randColor());
  return row;
}

function spawnPiece(){
  const colors = nextColors || [randColor(), randColor()];
  nextColors = nextNextColors || [randColor(), randColor()];
  nextNextColors = [randColor(), randColor()];
  const centerCol = Math.floor(COLS / 2);
  piece = {
    orientation: 0,
    cells: [
      { row:1, prevRow:1, col:centerCol, color: colors[0], active:true },
      { row:0, prevRow:0, col:centerCol, color: colors[1], active:true }
    ]
  };
  drawNextPreview();
  if(isBlocked(piece.cells[0]) || isBlocked(piece.cells[1])){
    triggerGameOver();
    return;
  }
  gameState = "FALLING";
  chainCount = 0;
  recentlyMovedCells = [];
}
function isBlocked(cell){
  return grid[cell.row][cell.col] !== null;
}

function performRise(){
  if(grid[0].some(v => v !== null)){
    triggerGameOver();
    return;
  }
  for(let r=0; r<ROWS-1; r++) grid[r] = grid[r+1];
  grid[ROWS-1] = randomRow();
  riseAnimStart = frameNow;

  for(const a of mixAnimations) a.row -= 1;
  for(const a of clearAnimations) a.row -= 1;
  for(const a of slideAnimations){ a.row -= 1; a.fromRow -= 1; }

  recentlyMovedCells = [];
  gameState = "SPAWN";
}

function resetGame(mode){
  selectedMode = mode || selectedMode;
  const cfg = MODE_CONFIG[selectedMode] || MODE_CONFIG.PRACTICE;
  grid = newGrid(cfg.initialRows);
  score = 0;
  dropTimer = 0;
  riseTimer = 0;
  riseInterval = cfg.riseInterval;
  chainCount = 0;
  maxChainInGame = 0;
  gameState = "SPAWN";
  resolveSubState = "CHECK";
  resolveWaitTimer = 0;
  gameOver = false;
  paused = false;
  mixAnimations = [];
  clearAnimations = [];
  slideAnimations = [];
  recentlyMovedCells = [];
  chainTextAnim = null;
  updateScore();
  nextColors = [randColor(), randColor()];
  nextNextColors = [randColor(), randColor()];
  piece = null;
}

function renderBestScoresList(mode){
  scoreListContainer.innerHTML = "";
  const list = highScores[mode] || [];
  if(list.length === 0){
    scoreListContainer.innerHTML = `<div class="emptyScores">No Records Yet</div>`;
    return;
  }
  list.forEach((item, index) => {
    const rankClass = index === 0 ? "rank1" : index === 1 ? "rank2" : index === 2 ? "rank3" : "";
    const row = document.createElement("div");
    row.className = "scoreRow";
    row.innerHTML = `
      <div class="scoreRank ${rankClass}">#${index + 1}</div>
      <div class="scoreVal">${item.score}</div>
      <div class="scoreChain">${item.maxChain} CHAIN${item.maxChain !== 1 ? 'S' : ''}</div>
    `;
    scoreListContainer.appendChild(row);
  });
}

/* ============================================================
   CLUSTER / MERGE / GRAVITY LOGIC
   ============================================================ */

function getConnectedCluster(startR, startC){
  const targetColor = grid[startR][startC];
  if(!targetColor || !["Y","C","M"].includes(targetColor)) return [];

  const cluster = [];
  const visited = Array.from({length: ROWS}, () => new Array(COLS).fill(false));
  const queue = [[startR, startC]];
  visited[startR][startC] = true;

  while(queue.length > 0){
    const [r, c] = queue.shift();
    cluster.push({row: r, col: c});

    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for(const [dr, dc] of dirs){
      const nr = r + dr, nc = c + dc;
      if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS){
        if(!visited[nr][nc] && grid[nr][nc] === targetColor){
          visited[nr][nc] = true;
          queue.push([nr, nc]);
        }
      }
    }
  }
  return cluster;
}

function mixResult(fallColor, stackColor){
  const key = fallColor + "," + stackColor;
  if(MIX_SECONDARY[key]) return MIX_SECONDARY[key];
  return null;
}

function processLandings(targetCells){
  let stateChanged = false;
  const uniqueKeys = new Set();
  const sortedCells = [];
  for(const cell of targetCells){
    const k = cell.row + "," + cell.col;
    if(!uniqueKeys.has(k)){
      uniqueKeys.add(k);
      sortedCells.push(cell);
    }
  }
  sortedCells.sort((a,b) => b.row - a.row);

  for(const lc of sortedCells){
    const r = lc.row;
    const c = lc.col;
    const myColor = grid[r][c];
    if(!myColor) continue;

    const underR = r + 1;
    if(underR >= ROWS) continue;
    const underColor = grid[underR][c];
    if(!underColor) continue;

    // 1. Color mix check
    const mixColor = mixResult(myColor, underColor);
    if(mixColor){
      mixAnimations.push({ row: underR, col: c, from: underColor, to: mixColor, start: frameNow, duration: MIX_ANIM_MS });
      grid[underR][c] = mixColor;
      grid[r][c] = null;
      score += 10;
      Audio_.merge();
      stateChanged = true;
      continue;
    }

    // 2. Complementary color landing clear check
    if(TRIGGER_PAIRS[underColor] && TRIGGER_PAIRS[underColor] === myColor){
      const cluster = getConnectedCluster(underR, c);
      if(cluster.length > 0){
        chainCount++;
        if(chainCount > maxChainInGame){
          maxChainInGame = chainCount;
        }
        const clearTargets = [...cluster, {row: r, col: c}];
        for(const t of clearTargets){
          clearAnimations.push({ row: t.row, col: t.col, start: frameNow, duration: CLEAR_ANIM_MS });
          grid[t.row][t.col] = null;
        }

        const earned = clearTargets.length * 30 * chainCount;
        score += earned;
        Audio_.clear(chainCount);

        chainTextAnim = {
          text: `${chainCount} CHAIN!`,
          x: c * cellSize + cellSize / 2,
          y: r * cellSize,
          start: frameNow
        };

        stateChanged = true;
      }
    }
  }

  updateScore();
  return stateChanged;
}

function applyGravity(){
  const movedCells = [];
  const slideDuration = softDropping ? SOFT_DROP_MS : DROP_INTERVAL_MS;
  for(let c = 0; c < COLS; c++){
    let writeR = ROWS - 1;
    for(let r = ROWS - 1; r >= 0; r--){
      if(grid[r][c] !== null){
        if(r !== writeR){
          grid[writeR][c] = grid[r][c];
          grid[r][c] = null;
          slideAnimations.push({ row: writeR, col: c, fromRow: r, start: frameNow, duration: slideDuration });
          movedCells.push({ row: writeR, col: c });
        }
        writeR--;
      }
    }
  }
  return movedCells;
}

function isAnimating(){
  return mixAnimations.length > 0 || clearAnimations.length > 0 || slideAnimations.length > 0;
}

/* ============================================================
   PIECE FALLING STEP
   ============================================================ */
function freezeCell(cell){
  grid[cell.row][cell.col] = cell.color;
  cell.active = false;
}

function stepPiece(){
  if(!piece) return;
  const ordered = piece.cells.slice().sort((a,b) => b.row - a.row);
  const newlyLandedCells = [];

  for(const cell of ordered){
    if(!cell.active) continue;
    cell.prevRow = cell.row;
    const targetRow = cell.row + 1;

    if(targetRow >= ROWS || grid[targetRow][cell.col] !== null){
      freezeCell(cell);
      newlyLandedCells.push({ row: cell.row, col: cell.col });
      Audio_.drop();
    } else {
      cell.row = targetRow;
    }
  }

  if(newlyLandedCells.length > 0){
    processLandings(newlyLandedCells);
  }

  if(piece.cells.every(c => !c.active)){
    recentlyMovedCells = [];
    piece = null;
    gameState = "CHECK_RESOLVE";
    resolveSubState = "CHECK";
  }
}

/* ============================================================
   MOVE / ROTATE
   ============================================================ */
const ROTATIONS = [ {dr:-1,dc:0}, {dr:0,dc:1}, {dr:1,dc:0}, {dr:0,dc:-1} ];

function canPlace(row, col){
  if(row<0 || row>=ROWS || col<0 || col>=COLS) return false;
  return grid[row][col] === null;
}

function moveHorizontal(dir){
  if(!running || paused || gameOver || gameState !== "FALLING") return;
  if(!piece || !piece.cells[0].active || !piece.cells[1].active) return;
  const a = piece.cells[0], b = piece.cells[1];
  const na = {row:a.row, col:a.col+dir};
  const nb = {row:b.row, col:b.col+dir};
  if(canPlace(na.row,na.col) && canPlace(nb.row,nb.col)){
    a.col = na.col; b.col = nb.col;
    Audio_.move();
  }
}

function rotatePiece(){
  if(!running || paused || gameOver || gameState !== "FALLING") return;
  if(!piece || !piece.cells[0].active || !piece.cells[1].active) return;
  const pivot = piece.cells[0];
  const nextOri = (piece.orientation + 1) % 4;
  const off = ROTATIONS[nextOri];
  let nr = pivot.row + off.dr;
  let nc = pivot.col + off.dc;

  let pr = pivot.row, pc = pivot.col;
  if(!canPlace(nr,nc)){
    const kicks = [ [0,-1], [0,1], [-1,0] ];
    let done = false;
    for(const [kr,kc] of kicks){
      const tpr = pivot.row+kr, tpc = pivot.col+kc;
      const tnr = tpr+off.dr, tnc = tpc+off.dc;
      if(canPlace(tpr,tpc) && canPlace(tnr,tnc)){
        pr=tpr; pc=tpc; nr=tnr; nc=tnc; done=true; break;
      }
    }
    if(!done) return;
  }
  pivot.row = pr; pivot.col = pc;
  piece.cells[1].row = nr; piece.cells[1].col = nc;
  piece.orientation = nextOri;
  pivot.prevRow = pivot.row;
  piece.cells[1].prevRow = piece.cells[1].row;
  Audio_.rotate();
}

function softDropStep(){
  if(!running || paused || gameOver || gameState !== "FALLING") return;
  stepPiece();
  dropTimer = 0;
}

/* ============================================================
   RENDER
   ============================================================ */
function resizeCanvases(){
  const wrap = document.getElementById("boardWrap");
  const availH = wrap.clientHeight - 16;
  const availW = wrap.clientWidth - 85;
  const bySizeH = Math.floor(availH / ROWS);
  const bySizeW = Math.floor(availW / COLS);
  cellSize = Math.max(14, Math.min(bySizeH, bySizeW, 40));

  const dpr = window.devicePixelRatio || 1;
  boardCanvas.width = COLS*cellSize*dpr;
  boardCanvas.height = ROWS*cellSize*dpr;
  boardCanvas.style.width = (COLS*cellSize)+"px";
  boardCanvas.style.height = (ROWS*cellSize)+"px";
  boardCtx.setTransform(dpr,0,0,dpr,0,0);

  const nextSize = Math.max(48, cellSize*2.1);
  nextCanvas.width = nextSize*dpr;
  nextCanvas.height = nextSize*dpr;
  nextCanvas.style.width = nextSize+"px";
  nextCanvas.style.height = nextSize+"px";
  nextCtx.setTransform(dpr,0,0,dpr,0,0);

  next2Canvas.width = nextSize*dpr;
  next2Canvas.height = nextSize*dpr;
  next2Canvas.style.width = nextSize+"px";
  next2Canvas.style.height = nextSize+"px";
  next2Ctx.setTransform(dpr,0,0,dpr,0,0);
}

const LABEL_TEXT_COLOR = {
  R:"#fff", G:"#052616", B:"#fff", Y:"#3a3300", C:"#00323a", M:"#3a0033", W:"#111"
};

function drawBlockBase(ctx, x, y, size, color){
  const pad = Math.max(1, size*0.06);
  const bx = x+pad, by = y+pad, bw = size-pad*2, bh = size-pad*2;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = COLOR_HEX[color] || "#888";
  ctx.shadowColor = COLOR_HEX[color] || "#888";
  ctx.shadowBlur = size*0.22;
  roundRect(ctx, bx, by, bw, bh, size*0.18);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = COLOR_HEX[color] || "#888";
  roundRect(ctx, bx, by, bw, bh, size*0.18);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = Math.max(1, size*0.04);
  roundRect(ctx, bx, by, bw, bh, size*0.18);
  ctx.stroke();
  ctx.restore();
}

function drawBlockLabel(ctx, x, y, size, color){
  ctx.save();
  ctx.fillStyle = LABEL_TEXT_COLOR[color] || "#000";
  ctx.font = "700 " + Math.round(size*0.42) + "px -apple-system,sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(color, x+size/2, y+size/2+size*0.02);
  ctx.restore();
}

function drawClusterConnections(ctx){
  ctx.save();
  ctx.lineWidth = Math.max(2, cellSize * 0.1);
  for(let r = 0; r < ROWS; r++){
    for(let c = 0; c < COLS; c++){
      const color = grid[r][c];
      if(color && ["Y","C","M"].includes(color)){
        const x = c * cellSize;
        const y = r * cellSize;
        ctx.strokeStyle = COLOR_HEX[color];
        if(c + 1 < COLS && grid[r][c+1] === color){
          ctx.beginPath();
          ctx.moveTo(x + cellSize/2, y + cellSize/2);
          ctx.lineTo(x + cellSize * 1.5, y + cellSize/2);
          ctx.stroke();
        }
        if(r + 1 < ROWS && grid[r+1][c] === color){
          ctx.beginPath();
          ctx.moveTo(x + cellSize/2, y + cellSize/2);
          ctx.lineTo(x + cellSize/2, y + cellSize * 1.5);
          ctx.stroke();
        }
      }
    }
  }
  ctx.restore();
}

function drawBlock(ctx, x, y, size, color){
  drawBlockBase(ctx, x, y, size, color);
  drawBlockLabel(ctx, x, y, size, color);
}

function drawMixWipe(ctx, x, y, size, fromColor, toColor, progress){
  drawBlockBase(ctx, x, y, size, fromColor);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, size, size*progress);
  ctx.clip();
  drawBlockBase(ctx, x, y, size, toColor);
  ctx.restore();
  if(progress > 0.65){
    ctx.save();
    ctx.globalAlpha = (progress-0.65)/0.35;
    drawBlockLabel(ctx, x, y, size, toColor);
    ctx.restore();
  }
}

function drawClearFlash(ctx, x, y, size, progress){
  let glow, alpha;
  if(progress < 0.25){
    glow = size*0.18*(progress/0.25);
    alpha = 1;
  }else if(progress < 0.6){
    const p = (progress-0.25)/0.35;
    glow = size*(0.18 + 1.0*p);
    alpha = 1;
  }else{
    const p = (progress-0.6)/0.4;
    glow = size*1.18;
    alpha = 1-p;
  }
  const pad = Math.max(1, size*0.06);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#ffffff";
  ctx.shadowBlur = glow;
  roundRect(ctx, x+pad, y+pad, size-pad*2, size-pad*2, size*0.18);
  ctx.fill();
  ctx.restore();
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBoard(){
  const w = COLS*cellSize, h = ROWS*cellSize;
  boardCtx.clearRect(0,0,w,h);

  const riseP = Math.min(1, (frameNow-riseAnimStart)/RISE_ANIM_MS);
  const riseOffset = riseP>=1 ? 0 : (1-easeOutCubic(riseP))*cellSize;
  boardCtx.save();
  boardCtx.translate(0, riseOffset);

  // Grid lines
  boardCtx.strokeStyle = "rgba(255,255,255,0.04)";
  boardCtx.lineWidth = 1;
  for(let c=1;c<COLS;c++){
    boardCtx.beginPath();
    boardCtx.moveTo(c*cellSize,0); boardCtx.lineTo(c*cellSize,h);
    boardCtx.stroke();
  }
  for(let r=1;r<ROWS;r++){
    boardCtx.beginPath();
    boardCtx.moveTo(0,r*cellSize); boardCtx.lineTo(w,r*cellSize);
    boardCtx.stroke();
  }

  drawClusterConnections(boardCtx);

  const mixByCell = {};
  for(let i=mixAnimations.length-1;i>=0;i--){
    const a = mixAnimations[i];
    const p = (frameNow-a.start)/a.duration;
    if(p>=1){ mixAnimations.splice(i,1); continue; }
    mixByCell[a.row+","+a.col] = { from:a.from, to:a.to, progress:Math.max(0,p) };
  }
  const slideByCell = {};
  for(let i=slideAnimations.length-1;i>=0;i--){
    const a = slideAnimations[i];
    const p = (frameNow-a.start)/a.duration;
    if(p>=1 || grid[a.row][a.col]===null){ slideAnimations.splice(i,1); continue; }
    slideByCell[a.row+","+a.col] = a.fromRow + (a.row-a.fromRow)*easeOutCubic(Math.max(0,p));
  }

  // Stacked blocks
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const colVal = grid[r][c];
      if(!colVal) continue;
      const key = r+","+c;
      const displayRow = slideByCell.hasOwnProperty(key) ? slideByCell[key] : r;
      const mix = mixByCell[key];
      if(mix && mix.to === colVal){
        drawMixWipe(boardCtx, c*cellSize, displayRow*cellSize, cellSize, mix.from, mix.to, mix.progress);
      }else{
        drawBlock(boardCtx, c*cellSize, displayRow*cellSize, cellSize, colVal);
      }
    }
  }

  for(let i=clearAnimations.length-1;i>=0;i--){
    const a = clearAnimations[i];
    const p = (frameNow-a.start)/a.duration;
    if(p>=1){ clearAnimations.splice(i,1); continue; }
    drawClearFlash(boardCtx, a.col*cellSize, a.row*cellSize, cellSize, Math.max(0,p));
  }

  boardCtx.restore();

  // Falling piece
  if(piece && gameState === "FALLING"){
    const interval = softDropping ? SOFT_DROP_MS : DROP_INTERVAL_MS;
    const progress = interval>0 ? Math.min(1, dropTimer/interval) : 1;
    for(const cell of piece.cells){
      if(cell.active){
        const pr = cell.prevRow != null ? cell.prevRow : cell.row;
        const displayRow = pr + (cell.row-pr)*progress;
        drawBlock(boardCtx, cell.col*cellSize, displayRow*cellSize, cellSize, cell.color);
      }
    }
  }

  // Chain text popup animation
  if(chainTextAnim){
    const elapsed = frameNow - chainTextAnim.start;
    if(elapsed > 1000){
      chainTextAnim = null;
    } else {
      const alpha = 1 - (elapsed / 1000);
      const dy = (elapsed / 1000) * 35;
      boardCtx.save();
      boardCtx.globalAlpha = alpha;
      boardCtx.font = "900 " + Math.round(cellSize * 0.95) + "px -apple-system,sans-serif";
      boardCtx.fillStyle = "#fff21a";
      boardCtx.strokeStyle = "#000000";
      boardCtx.lineWidth = 4;
      boardCtx.textAlign = "center";
      boardCtx.strokeText(chainTextAnim.text, chainTextAnim.x, chainTextAnim.y - dy);
      boardCtx.fillText(chainTextAnim.text, chainTextAnim.x, chainTextAnim.y - dy);
      boardCtx.restore();
    }
  }
}

function drawNextPreview(){
  const s = nextCanvas.width / (window.devicePixelRatio||1);
  nextCtx.clearRect(0,0,s,s);
  if(nextColors){
    const cell = s*0.34;
    const cx = s/2;
    drawBlock(nextCtx, cx-cell/2, s*0.14, cell, nextColors[1]);
    drawBlock(nextCtx, cx-cell/2, s*0.14+cell, cell, nextColors[0]);
  }

  const s2 = next2Canvas.width / (window.devicePixelRatio||1);
  next2Ctx.clearRect(0,0,s2,s2);
  if(nextNextColors){
    const cell2 = s2*0.34;
    const cx2 = s2/2;
    drawBlock(next2Ctx, cx2-cell2/2, s2*0.14, cell2, nextNextColors[1]);
    drawBlock(next2Ctx, cx2-cell2/2, s2*0.14+cell2, cell2, nextNextColors[0]);
  }
}

function updateScore(){
  scoreVal.textContent = score;
}

function updateRiseMeter(){
  if(riseInterval <= 0){
    riseMeterWrap.classList.add("hidden");
    return;
  }
  riseMeterWrap.classList.remove("hidden");
  const remain = 1 - Math.min(1, riseTimer/riseInterval);
  riseMeterMask.style.width = (remain*100) + "%";
}

/* ============================================================
   GAME LOOP
   ============================================================ */
function loop(t){
  if(!lastTime) lastTime = t;
  const dt = t - lastTime;
  lastTime = t;

  if(running && !paused && !gameOver){
    frameNow = t;

    if(gameState === "SPAWN"){
      spawnPiece();
    }
    else if(gameState === "FALLING"){
      dropTimer += dt;
      const interval = softDropping ? SOFT_DROP_MS : DROP_INTERVAL_MS;
      if(dropTimer >= interval){
        dropTimer = 0;
        stepPiece();
      }
    }
    else if(gameState === "CHECK_RESOLVE"){
      if(resolveSubState === "CHECK"){
        if(!isAnimating()){
          if(recentlyMovedCells.length > 0){
            const targets = [...recentlyMovedCells];
            recentlyMovedCells = [];
            
            const stateChanged = processLandings(targets);
            if(stateChanged){
              resolveSubState = "WAITING_GRAVITY";
              resolveWaitTimer = 0;
            } else {
              const movedCells = applyGravity();
              if(movedCells.length > 0){
                recentlyMovedCells = movedCells;
              } else {
                if(riseInterval > 0 && riseTimer >= riseInterval){
                  riseTimer = 0;
                  performRise();
                } else {
                  gameState = "SPAWN";
                }
              }
            }
          } else {
            const movedCells = applyGravity();
            if(movedCells.length > 0){
              recentlyMovedCells = movedCells;
            } else {
              if(riseInterval > 0 && riseTimer >= riseInterval){
                riseTimer = 0;
                performRise();
              } else {
                gameState = "SPAWN";
              }
            }
          }
        }
      } 
      else if(resolveSubState === "WAITING_GRAVITY"){
        if(!isAnimating()){
          resolveWaitTimer += dt;
          if(resolveWaitTimer >= POST_CLEAR_WAIT_MS){
            resolveWaitTimer = 0;
            const movedCells = applyGravity();
            recentlyMovedCells = movedCells;
            resolveSubState = "CHECK";
          }
        }
      }
    }

    if(riseInterval > 0 && gameState === "FALLING"){
      riseTimer += dt;
    }
    updateRiseMeter();
    drawBoard();
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   FLOW CONTROL
   ============================================================ */
function startGame(mode){
  resetGame(mode);
  running = true;
  paused = false;
  gameOver = false;
  titleScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  bestScoresScreen.classList.add("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("controls").classList.remove("hidden");
  resizeCanvases();
  drawBoard();
  drawNextPreview();
}

function triggerGameOver(){
  gameOver = true;
  running = false;
  Audio_.gameOver();
  finalScoreEl.textContent = score;
  maxChainVal.textContent = maxChainInGame;

  const currentList = highScores[selectedMode] || [];
  const bestRecord = currentList[0] || { score: 0 };
  
  // スコアリストに追加して降順ソート
  currentList.push({ score: score, maxChain: maxChainInGame });
  currentList.sort((a, b) => b.score - a.score);
  
  // Top 5 のみ保持
  highScores[selectedMode] = currentList.slice(0, 5);

  if(score > bestRecord.score && score > 0){
    newBestTag.classList.remove("hidden");
  } else {
    newBestTag.classList.add("hidden");
  }
  
  gameOverBestVal.textContent = highScores[selectedMode][0]?.score || 0;
  gameOverScreen.classList.remove("hidden");
}

function togglePause(){
  if(!running || gameOver) return;
  paused = !paused;
  pauseScreen.classList.toggle("hidden", !paused);
  pauseBtn.textContent = paused ? "▶" : "❚❚";
}

function backToTitle(){
  running = false;
  paused = false;
  gameOver = false;
  pauseBtn.textContent = "❚❚";
  pauseScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  bestScoresScreen.classList.add("hidden");
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("controls").classList.add("hidden");
  riseMeterWrap.classList.add("hidden");

  document.querySelectorAll(".diffbtn").forEach(b => b.classList.remove("selecting"));
  resetGame(selectedMode);
  drawBoard();
  drawNextPreview();

  titleScreen.classList.remove("hidden");
}

/* ============================================================
   INPUT: KEYBOARD
   ============================================================ */
window.addEventListener("keydown", (e)=>{
  if(e.repeat) return;
  switch(e.key){
    case "ArrowLeft": moveHorizontal(-1); break;
    case "ArrowRight": moveHorizontal(1); break;
    case "ArrowUp": rotatePiece(); break;
    case "ArrowDown": softDropStep(); break;
    case " ": rotatePiece(); break;
  }
});

/* ============================================================
   INPUT: TOUCH
   ============================================================ */
function bindHold(el, onTap){
  el.addEventListener("touchstart",(e)=>{ e.preventDefault(); onTap(); }, {passive:false});
  el.addEventListener("mousedown",(e)=>{ e.preventDefault(); onTap(); });
}
function bindRepeat(el, action, initialDelayMs, repeatMs){
  let delayTimer = null, repeatTimer = null;
  function start(e){
    e.preventDefault();
    stop();
    action();
    delayTimer = setTimeout(()=>{
      repeatTimer = setInterval(action, repeatMs);
    }, initialDelayMs);
  }
  function stop(e){
    if(e) e.preventDefault();
    clearTimeout(delayTimer); delayTimer = null;
    clearInterval(repeatTimer); repeatTimer = null;
  }
  el.addEventListener("touchstart", start, {passive:false});
  el.addEventListener("touchend", stop, {passive:false});
  el.addEventListener("touchcancel", stop, {passive:false});
  el.addEventListener("mousedown", start);
  window.addEventListener("mouseup", stop);
}
bindRepeat(document.getElementById("leftBtn"), ()=>moveHorizontal(-1), 260, 110);
bindRepeat(document.getElementById("rightBtn"), ()=>moveHorizontal(1), 260, 110);
bindHold(document.getElementById("rotateBtn"), ()=>rotatePiece());

const downBtn = document.getElementById("downBtn");
function startSoftDrop(e){ e.preventDefault(); softDropping = true; }
function stopSoftDrop(e){ if(e) e.preventDefault(); softDropping = false; }
downBtn.addEventListener("touchstart", startSoftDrop, {passive:false});
downBtn.addEventListener("touchend", stopSoftDrop, {passive:false});
downBtn.addEventListener("touchcancel", stopSoftDrop, {passive:false});
downBtn.addEventListener("mousedown", startSoftDrop);
window.addEventListener("mouseup", stopSoftDrop);

// Board touch gestures & hold for soft drop
let touchStartX=0, touchStartY=0, touchActive=false, dragBaseX=0, draggedThisGesture=false;
let longPressTimer=null, longPressTriggered=false;
const LONG_PRESS_MS = 220;
const MOVE_CANCEL_PX = 14;

boardCanvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  const t = e.touches[0];
  touchStartX=t.clientX; touchStartY=t.clientY; touchActive=true;
  dragBaseX = t.clientX;
  draggedThisGesture = false;
  longPressTriggered = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(()=>{
    if(touchActive){
      longPressTriggered = true;
      softDropping = true;
    }
  }, LONG_PRESS_MS);
},{passive:false});

boardCanvas.addEventListener("touchmove",(e)=>{
  e.preventDefault();
  if(!touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX-touchStartX, dy = t.clientY-touchStartY;

  if(!longPressTriggered && (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX)){
    clearTimeout(longPressTimer);
  }

  const dragDx = t.clientX - dragBaseX;
  if(Math.abs(dragDx) >= cellSize){
    const steps = Math.trunc(dragDx / cellSize);
    for(let i=0;i<Math.abs(steps);i++) moveHorizontal(steps > 0 ? 1 : -1);
    dragBaseX += steps*cellSize;
    draggedThisGesture = true;
  }
},{passive:false});

boardCanvas.addEventListener("touchend",(e)=>{
  e.preventDefault();
  clearTimeout(longPressTimer);
  if(!touchActive) return;
  touchActive=false;

  if(longPressTriggered){
    softDropping = false;
    longPressTriggered = false;
    return;
  }
  if(draggedThisGesture){
    return;
  }

  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if(absX < 16 && absY < 16){
    rotatePiece();
    return;
  }
  if(dy > absX){
    softDropStep();
  }
},{passive:false});

boardCanvas.addEventListener("touchcancel",()=>{
  clearTimeout(longPressTimer);
  touchActive=false;
  draggedThisGesture=false;
  if(longPressTriggered){ softDropping=false; longPressTriggered=false; }
},{passive:false});

document.addEventListener("gesturestart",(e)=>{ e.preventDefault(); });
document.addEventListener("touchmove",(e)=>{ e.preventDefault(); },{passive:false});

let lastTouchEndAt = 0;
document.addEventListener("touchend",(e)=>{
  const now = Date.now();
  if(now - lastTouchEndAt <= 350){
    e.preventDefault();
  }
  lastTouchEndAt = now;
},{passive:false});

/* ============================================================
   UI BUTTONS
   ============================================================ */
document.getElementById("retryBtn").addEventListener("click", ()=>startGame(selectedMode));
document.querySelectorAll(".diffbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    selectedMode = btn.dataset.diff;
    document.querySelectorAll(".diffbtn").forEach(b=>{
      b.classList.toggle("active", b===btn);
      b.classList.remove("selecting");
    });
    void btn.offsetWidth;
    btn.classList.add("selecting");
    setTimeout(()=>{
      btn.classList.remove("selecting");
      startGame(selectedMode);
    }, 480);
  });
});

// Best Scores Modal Trigger
document.getElementById("bestScoresBtn").addEventListener("click", ()=>{
  viewScoreTab = selectedMode;
  document.querySelectorAll(".tabbtn").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === viewScoreTab);
  });
  renderBestScoresList(viewScoreTab);
  bestScoresScreen.classList.remove("hidden");
});

document.getElementById("scoresCloseBtn").addEventListener("click", ()=>{
  bestScoresScreen.classList.add("hidden");
});

document.querySelectorAll(".tabbtn").forEach(tab => {
  tab.addEventListener("click", ()=>{
    viewScoreTab = tab.dataset.tab;
    document.querySelectorAll(".tabbtn").forEach(t => {
      t.classList.toggle("active", t === tab);
    });
    renderBestScoresList(viewScoreTab);
  });
});

document.getElementById("titleBtn").addEventListener("click", backToTitle);
document.getElementById("quitBtn").addEventListener("click", backToTitle);
document.getElementById("resumeBtn").addEventListener("click", togglePause);
pauseBtn.addEventListener("click", togglePause);
soundBtn.addEventListener("click", ()=>{
  const muted = Audio_.toggleMute();
  soundBtn.textContent = muted ? "🔇" : "🔊";
});

let wasPausedBeforeHelp = false;
const helpScreen = document.getElementById("helpScreen");
document.getElementById("helpBtn").addEventListener("click", ()=>{
  if(helpScreen.classList.contains("hidden")){
    if(running && !gameOver){
      wasPausedBeforeHelp = paused;
      if(!paused){ paused = true; pauseBtn.textContent = "▶"; }
    }
    helpScreen.classList.remove("hidden");
  } else {
    helpScreen.classList.add("hidden");
    if(running && !gameOver && !wasPausedBeforeHelp){
      paused = false; pauseBtn.textContent = "❚❚";
    }
  }
});
document.getElementById("helpCloseBtn").addEventListener("click", ()=>{
  helpScreen.classList.add("hidden");
  if(running && !gameOver && !wasPausedBeforeHelp){
    paused = false; pauseBtn.textContent = "❚❚";
  }
});

window.addEventListener("resize", ()=>{ resizeCanvases(); drawBoard(); });

/* ============================================================
   STARTUP
   ============================================================ */
resetGame();
resizeCanvases();
drawBoard();
drawNextPreview();
requestAnimationFrame(loop);

})();
</script>
