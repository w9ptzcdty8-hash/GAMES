<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Color Sense</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="topbar" class="hidden">
    <div class="stat">SCORE<b id="scoreVal">0</b></div>
    <div class="btns">
      <button class="iconbtn" id="helpBtn" aria-label="Color Guide">?</button>
      <button class="iconbtn" id="soundBtn" aria-label="Toggle Sound">🔊</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">❚❚</button>
    </div>
  </div>

  <div id="riseMeterWrap" class="hidden">
    <div id="riseMeterTrack">
      <div id="riseMeterMask"></div>
    </div>
    <div id="riseMeterLabel">Until Rise</div>
  </div>

  <div id="boardWrap">
    <div id="boardInner">
      <canvas id="board"></canvas>
      <div id="nextWrap">
        <div id="nextLabel">NEXT</div>
        <canvas id="next"></canvas>
        <div id="next2Label">NEXT 2</div>
        <canvas id="next2"></canvas>
        <div class="miniVenn">
          <svg viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="200" height="185" fill="#050508"/>
            <circle cx="100" cy="62" r="55" fill="#ff1236" style="mix-blend-mode:screen"/>
            <circle cx="72" cy="122" r="55" fill="#14ff5c" style="mix-blend-mode:screen"/>
            <circle cx="128" cy="122" r="55" fill="#1560ff" style="mix-blend-mode:screen"/>
            <g font-family="-apple-system,sans-serif" font-weight="700" text-anchor="middle">
              <text x="100" y="42" font-size="14" fill="#111">R</text>
              <text x="48" y="138" font-size="14" fill="#111">G</text>
              <text x="152" y="138" font-size="14" fill="#111">B</text>
              <text x="76" y="86" font-size="11" fill="#3a3300">Y</text>
              <text x="124" y="86" font-size="11" fill="#3a0033">M</text>
              <text x="100" y="140" font-size="11" fill="#00323a">C</text>
              <text x="100" y="108" font-size="11" fill="#111">W</text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- Title Screen -->
    <div class="overlay" id="titleScreen">
      <h1 class="title">COLOR SENSE</h1>
      <p class="subtitle">Mix Colors, Make White</p>

      <div class="vennWrap">
        <svg viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="200" height="185" fill="#050508"/>
          <circle cx="100" cy="62" r="55" fill="#ff1236" style="mix-blend-mode:screen"/>
          <circle cx="72" cy="122" r="55" fill="#14ff5c" style="mix-blend-mode:screen"/>
          <circle cx="128" cy="122" r="55" fill="#1560ff" style="mix-blend-mode:screen"/>
          <g font-family="-apple-system,sans-serif" font-weight="700" text-anchor="middle">
            <text x="100" y="42" font-size="14" fill="#111">R</text>
            <text x="48" y="138" font-size="14" fill="#111">G</text>
            <text x="152" y="138" font-size="14" fill="#111">B</text>
            <text x="76" y="86" font-size="11" fill="#3a3300">Y</text>
            <text x="124" y="86" font-size="11" fill="#3a0033">M</text>
            <text x="100" y="140" font-size="11" fill="#00323a">C</text>
            <text x="100" y="108" font-size="11" fill="#111">W</text>
          </g>
        </svg>
        <div class="vennCaption">
          R+B=M / B+G=C / G+R=Y<br>
          R+B+G=W<br>
          Y, C, M connect together.
        </div>
      </div>

      <div class="diffContainer">
        <div class="diffRow">
          <button class="diffbtn active" data-diff="EASY">EASY</button>
          <button class="diffbtn" data-diff="NORMAL">NORMAL</button>
          <button class="diffbtn" data-diff="HARD">HARD</button>
        </div>
        <button class="diffbtn" data-diff="PRACTICE">PRACTICE</button>
        <button class="bestScoresBtn" id="bestScoresBtn">🏆 BEST SCORES</button>
      </div>

      <div class="mrs-games-link-container">
        <a href="https://mrs-games.pages.dev" target="_blank" rel="noopener noreferrer" class="mrs-games-link">MRS GAMES</a>
      </div>
    </div>

    <!-- Best Scores Screen -->
    <div class="overlay hidden" id="bestScoresScreen">
      <p class="dim" style="letter-spacing:.1em; font-weight:700;">TOP 5 SCORES</p>
      
      <div class="scoreTabRow">
        <button class="tabbtn active" data-tab="EASY">EASY</button>
        <button class="tabbtn" data-tab="NORMAL">NORMAL</button>
        <button class="tabbtn" data-tab="HARD">HARD</button>
        <button class="tabbtn" data-tab="PRACTICE">PRACTICE</button>
      </div>

      <div class="scoreList" id="scoreListContainer">
        <!-- JSでスコア行を動的生成 -->
      </div>

      <button class="ghostbtn" id="scoresCloseBtn">Close</button>
    </div>

    <!-- How to Play (Guide) Screen -->
    <div class="overlay hidden" id="helpScreen">
      <p class="dim" style="letter-spacing:.1em;">PRIMARY LIGHT COLORS & RULES</p>
      <div class="vennWrap">
        <svg viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="200" height="185" fill="#050508"/>
          <circle cx="100" cy="62" r="55" fill="#ff1236" style="mix-blend-mode:screen"/>
          <circle cx="72" cy="122" r="55" fill="#14ff5c" style="mix-blend-mode:screen"/>
          <circle cx="128" cy="122" r="55" fill="#1560ff" style="mix-blend-mode:screen"/>
          <g font-family="-apple-system,sans-serif" font-weight="700" text-anchor="middle">
            <text x="100" y="42" font-size="14" fill="#111">R</text>
            <text x="48" y="138" font-size="14" fill="#111">G</text>
            <text x="152" y="138" font-size="14" fill="#111">B</text>
            <text x="76" y="86" font-size="11" fill="#3a3300">Y</text>
            <text x="124" y="86" font-size="11" fill="#3a0033">M</text>
            <text x="100" y="140" font-size="11" fill="#00323a">C</text>
            <text x="100" y="108" font-size="11" fill="#111">W</text>
          </g>
        </svg>
        <div class="vennCaption">
          R+B=M / B+G=C / G+R=Y<br>
          R+B+G=W<br>
          Y, C, M connect together.
        </div>
      </div>
      <button class="ghostbtn" id="helpCloseBtn">Close</button>
    </div>

    <!-- Pause Screen -->
    <div class="overlay hidden" id="pauseScreen">
      <p class="dim" style="font-size:20px;letter-spacing:.1em;">PAUSED</p>
      <button class="primarybtn" id="resumeBtn">Resume</button>
      <button class="ghostbtn" id="quitBtn">Quit to Title</button>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="gameOverScreen">
      <p class="dim" style="letter-spacing:.1em;">GAME OVER</p>
      <div id="newBestTag" class="newBestTag hidden">NEW BEST!</div>
      <div class="bignum" id="finalScore">0</div>
      <div class="dim" style="margin-top:-10px;">MAX CHAIN: <span id="maxChainVal" style="color:var(--c); font-weight:700;">0</span></div>
      <div class="dim" style="margin-top:-6px;">BEST: <span id="gameOverBestVal">0</span></div>
      <button class="primarybtn" id="retryBtn">Retry</button>
      <button class="ghostbtn" id="titleBtn">Title</button>
    </div>
  </div>

</div>

<!-- ========================================
     固定広告
======================================== -->
<div class="ad-banner">
  <div style="max-width: 100%;">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
    <!-- admax -->
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
